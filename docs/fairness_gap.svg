    <text x="94" y="176" text-anchor="end">40%</text>
    <text x="94" y="135" text-anchor="end">50%</text>
  </g>

  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="120" y1="294" x2="900" y2="294"/>
    <line x1="120" y1="253" x2="900" y2="253"/>
    <line x1="120" y1="212" x2="900" y2="212"/>
    <line x1="120" y1="171" x2="900" y2="171"/>
    <line x1="120" y1="130" x2="900" y2="130"/>
  </g>

  <rect x="250" y="163" width="190" height="172" rx="16" fill="#6366f1" opacity="0.92"/>
  <rect x="590" y="327" width="190" height="8" rx="4" fill="#14b8a6"/>

  <text x="345" y="145" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#4338ca">42.0%</text>
  <text x="685" y="309" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#0f766e">2.0%</text>

  <text x="345" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#334155">Non-native-English proxy</text>
  <text x="685" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#334155">Native-English proxy</text>

  <rect x="278" y="391" width="134" height="24" rx="12" fill="#eef2ff"/>
