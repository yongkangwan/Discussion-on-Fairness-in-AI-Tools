  <text x="500" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#64748b">Mean predicted paper-mill probability on 5,000 legitimate high-impact-journal papers per group</text>

  <line x1="120" y1="335" x2="900" y2="335" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="120" y1="130" x2="120" y2="335" stroke="#cbd5e1" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748b">
