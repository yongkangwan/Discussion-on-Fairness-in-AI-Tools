  <rect x="618" y="391" width="134" height="24" rx="12" fill="#ecfdf5"/>
  <text x="685" y="408" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#0f766e">n = 5,000</text>
