<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#f7f4ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#94a3b8" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <text x="600" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#172554">Three-stage case study</text>

  <g filter="url(#shadow)">
    <rect x="55" y="95" width="300" height="190" rx="24" fill="#eef6ff" stroke="#bfdbfe"/>
    <rect x="450" y="95" width="300" height="190" rx="24" fill="#eefbf5" stroke="#bbf7d0"/>
    <rect x="845" y="95" width="300" height="190" rx="24" fill="#f6f1ff" stroke="#ddd6fe"/>
  </g>

  <circle cx="98" cy="132" r="21" fill="#2563eb"/>
  <text x="98" y="140" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="white">1</text>
  <text x="135" y="137" font-family="Arial" font-size="22" font-weight="700" fill="#1e3a8a">Model reproduction</text>
  <text x="85" y="180" font-family="Arial" font-size="17" fill="#334155">Rebuild the BERT-based</text>
  <text x="85" y="206" font-family="Arial" font-size="17" fill="#334155">paper-mill screening pipeline</text>
  <text x="85" y="242" font-family="Arial" font-size="16" font-weight="700" fill="#2563eb">Establish a credible baseline</text>

  <circle cx="493" cy="132" r="21" fill="#16a34a"/>
  <text x="493" y="140" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="white">2</text>
  <text x="530" y="137" font-family="Arial" font-size="22" font-weight="700" fill="#166534">Real-world audit</text>
  <text x="480" y="180" font-family="Arial" font-size="17" fill="#334155">5,000 non-native-English vs.</text>
  <text x="480" y="206" font-family="Arial" font-size="17" fill="#334155">5,000 native-English papers</text>
  <text x="480" y="242" font-family="Arial" font-size="16" font-weight="700" fill="#16a34a">42.0% vs. 2.0% mean score</text>

  <circle cx="888" cy="132" r="21" fill="#7c3aed"/>
  <text x="888" y="140" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="white">3</text>
  <text x="925" y="137" font-family="Arial" font-size="22" font-weight="700" fill="#5b21b6">Controlled style tests</text>
  <text x="875" y="180" font-family="Arial" font-size="17" fill="#334155">Hold content fixed and vary</text>
  <text x="875" y="206" font-family="Arial" font-size="17" fill="#334155">linguistic style with LLMs</text>
  <text x="875" y="242" font-family="Arial" font-size="16" font-weight="700" fill="#7c3aed">Style alone can flip predictions</text>

  <path d="M370 190 H430" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <path d="M420 178 L434 190 L420 202" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M765 190 H825" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <path d="M815 178 L829 190 L815 202" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="600" y="330" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#0f172a">From reproduction → disparity measurement → causal stress test</text>
</svg>